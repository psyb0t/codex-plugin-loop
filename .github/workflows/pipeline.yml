name: pipeline

# loop is a Codex plugin — a manifest plus one skill, with no build artifact and
# no package to publish. Validation is `make test`, which only needs the pinned
# dev container, so the pipeline exists to render the README badges on tag
# pushes.
#
# No clawhub-publish job: that workflow globs `.agents/skills/*/SKILL.md`, and
# this plugin keeps its skill at `skills/loop/SKILL.md` because the repository
# root itself is the plugin (referenced from the central marketplace with
# `source: "url"` and no `path`).
on:
  push:
    tags:
      - "v*"

jobs:
  badges:
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
